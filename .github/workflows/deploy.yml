# Deploy Omni CRM to VPS (root server)
# Push to main → Build → Deploy → Migrate → Restart

name: Deploy Omni CRM to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://imoics.com/api' }}
        run: |
          npm ci
          npm run build
          echo "✅ Frontend build completed"

      - name: Build Backend
        working-directory: ./server
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npm run build
          echo "✅ Backend build completed"

      - name: Deploy Frontend to VPS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "client/dist/*"
          target: "~/omni-repo/client/dist/"
          strip_components: 2
          timeout: 60s
          overwrite: true

      - name: Deploy Backend dist to VPS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "server/dist/*"
          target: "~/omni-repo/server/dist/"
          strip_components: 2
          timeout: 60s
          overwrite: true

      - name: Git Pull, Migrate, Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          timeout: 120s
          script: |
            set -e
            echo "🚀 Post-deploy on VPS..."

            cd ~/omni-repo
            git pull origin main || git pull origin master
            echo "✅ Git pull completed"

            cd ~/omni-repo/server
            npm install --ignore-scripts
            npx prisma generate
            node scripts/migrate-simple.cjs
            echo "✅ npm install, prisma generate, migrations done"

            if command -v pm2 &> /dev/null; then
              pm2 restart omni || pm2 start dist/server.js --name omni
              echo "✅ PM2 restart done"
            else
              echo "⚠️ PM2 not found - restart backend manually if needed"
            fi

            echo "🎉 VPS Deployment complete!"

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ VPS deployment completed successfully!"
          else
            echo "❌ Deployment failed! Check the logs above."
          fi
